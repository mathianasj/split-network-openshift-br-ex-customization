apiVersion: v1
baseDomain: example.com
metadata:
  name: ocp-cluster
networking:
  networkType: OVNKubernetes
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  serviceNetwork:
  - 172.30.0.0/16
  machineNetwork:
  - cidr: 192.168.26.0/24
compute:
- name: worker
  replicas: 2
controlPlane:
  name: master
  replicas: 3
platform:
  none: {}
pullSecret: '<pull-secret-here>'
sshKey: '<ssh-key-here>'
