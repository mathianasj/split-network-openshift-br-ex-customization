apiVersion: v1alpha1
kind: AgentConfig
metadata:
  name: ocpsno
rendezvousIP: 192.168.26.111
hosts:
  - hostname: sno-node
    role: master
    rootDeviceHints:
      deviceName: /dev/sda
    interfaces:
      - name: ens18
        macAddress: BC:24:11:2C:46:68
      - name: ens19
        macAddress: BC:24:11:48:BD:18
    networkConfig:
      interfaces:
        - name: ens18
          type: ethernet
          state: up
          mac-address: BC:24:11:2C:46:68
          ipv4:
            enabled: true
            dhcp: true
            auto-dns: false
            auto-gateway: false
            auto-routes: false
          ipv6:
            enabled: false
        - name: ens19
          type: ethernet
          state: up
          mac-address: BC:24:11:48:BD:18
          ipv4:
            enabled: true
            dhcp: true
            auto-dns: false
            auto-gateway: false
            auto-routes: false
          ipv6:
            enabled: false
      dns-resolver:
        config:
          server:
            - 192.168.26.128
      routes:
        config:
          - destination: 0.0.0.0/0
            next-hop-interface: ens18
            next-hop-address: 192.168.6.1
            table-id: 254
